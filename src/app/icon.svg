    d="M 5.5 20 H 10.6 L 13.4 29.2 L 16.2 20 H 21.3 L 15.7 34.3 V 44.5 H 11.1 V 34.3 L 5.5 20 Z"
    fill="#f7f4ef"
  />

  <!-- T (Warm Luxury White #f7f4ef) -->
  <path
    d="M 23.8 20 H 38.8 V 24.3 H 33.6 V 44.5 H 29.0 V 24.3 H 23.8 V 20 Z"
    fill="#f7f4ef"
  />

  <!-- G (Crisp Geometric Sans #ff2626 with Flat Terminals Matching Y & T) -->
  <path
    d="M 57.6 26.8 C 56.5 22.3 53.6 19.7 49.8 19.7 C 44.6 19.7 41.4 23.8 41.4 32.25 C 41.4 40.7 44.6 44.8 49.9 44.8 C 54.4 44.8 57.8 41.8 57.8 36.2 V 31.2 H 49.6 V 35.3 H 53.3 V 36.4 C 53.3 39.2 52.0 40.5 50.0 40.5 C 47.2 40.5 46.1 38.2 46.1 32.25 C 46.1 26.3 47.2 24.0 49.9 24.0 C 51.7 24.0 52.7 25.0 53.1 26.8 H 57.6 Z"
