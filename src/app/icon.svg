<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ytgBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19191e" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <radialGradient id="ytgRedAura" cx="80%" cy="76%" r="55%">
      <stop offset="0%" stop-color="#ff2626" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#ff2626" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ytgBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#ff2626" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff2626" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="ytgRed" x1="42" y1="20" x2="58" y2="44.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3d3d" />
      <stop offset="100%" stop-color="#dc0808" />
    </linearGradient>
  </defs>

  <!-- Full-Bleed Solid Obsidian Squircle (Crisp on Light & Dark Browser Tabs) -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="url(#ytgBg)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="url(#ytgRedAura)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#ytgBorder)" stroke-width="1.5" />

  <!-- Subtle Top Specular Sheen -->
  <path d="M 16 2.5 H 48" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" stroke-linecap="round" />

  <!-- Signature Crimson Brand Dot -->
  <circle cx="53.5" cy="10.5" r="2.2" fill="#ff2626" />

  <!-- Y (Warm Luxury White #f7f4ef) -->
